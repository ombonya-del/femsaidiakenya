name: Generate Intel Brief PDF

# Builds the public Intel Brief PDF when an editor PUBLISHES a brief: the
# intel-brief edge function fires a repository_dispatch (event: publish-brief)
# with the approved brief's id. Biweekly DRAFT generation is handled separately
# by the Supabase pg_cron job that calls the intel-brief edge function.
on:
  repository_dispatch:
    types: [publish-brief]
  workflow_dispatch:
    inputs:
      brief_id:
        description: 'Brief UUID to render (blank = latest active)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install reportlab requests

      - name: Generate PDF
        run: |
          BRIEF_ID="${{ github.event.client_payload.brief_id || github.event.inputs.brief_id }}"
          if [ -n "$BRIEF_ID" ]; then
            echo "Rendering brief $BRIEF_ID"
            python3 scripts/generate_brief.py --id "$BRIEF_ID"
          else
            echo "Rendering latest brief"
            python3 scripts/generate_brief.py
          fi

      - name: Commit and push
        run: |
          git config user.name "FemSaidia Bot"
          git config user.email "bot@femsaidiakenya.org"
          git add public/intel-brief-latest.pdf public/intel-brief-latest-viewer.html
          git diff --staged --quiet || git commit -m "brief: publish $(date +%Y-%m-%d)"
          git push
