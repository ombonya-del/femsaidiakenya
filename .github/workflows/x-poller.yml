name: X poller

# Weekly pull of the curated X sources — advocacy/manosphere handles, keyword
# searches, and the "Femsaidiakenya" List (set X_LIST_FEMSAIDIA) — into
# sentiment_articles (Community Pulse) and the MOTD review queue.

# NOTE: X API path disabled (credits depleted / 402). Kept for manual use only if
# you fund the X API again. Otherwise FemSaidia's X sentiment is refreshed via the
# browser-based scheduled task (no API).
on:
  workflow_dispatch:

env:
  SUPABASE_URL: https://uuluuhltphgwfblcghlp.supabase.co
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1bHV1aGx0cGhnd2ZibGNnaGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjI2NDAsImV4cCI6MjA5MzQ5ODY0MH0.KU_wtm0NVUz8vrMqgozPvTlmiCIf_yXP8Z3Gpmh599E

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger x-poller
        run: |
          set -e
          RESP=$(curl -sS -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/x-poller" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 120)
          echo "$RESP"
          [ "$(echo "$RESP" | tail -n1)" = "200" ] || exit 1
